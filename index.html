<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>آزمایشگاه تعاملی قدر مطلق | جشنواره خوارزمی</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;600;800&display=swap');

*{box-sizing:border-box;}
body{
margin:0;
font-family:'Vazirmatn',sans-serif;
background:radial-gradient(circle at top,#0f2027,#203a43,#000);
color:#fff;
overflow-x:hidden;
}

/* HEADER */
header{text-align:center;padding:40px 20px}
h1{color:#00ffd5;font-size:2.6rem}
h2{text-align:center;color:#00ffd5}

/* PANEL */
.panel{
max-width:1000px;
margin:30px auto;
background:rgba(255,255,255,.05);
border-radius:20px;
padding:30px;
box-shadow:0 0 30px rgba(0,255,213,.25);
}

/* FALLING MATH */
.math-rain{
position:fixed;
top:-50px;
pointer-events:none;
font-weight:600;
animation:fall linear forwards;
filter:drop-shadow(0 0 8px currentColor);
opacity:.85;
z-index:0;
}
@keyframes fall{
to{transform:translateY(110vh) rotate(360deg);opacity:0}
}

/* NUMBER AXIS */
#numberAxis{
display:block;
margin:30px auto;
background:rgba(255,255,255,.06);
border-radius:16px;
box-shadow:0 0 25px rgba(0,255,213,.25);
touch-action:none;
}

/* VIDEO */
.video-box{
position:relative;
padding-top:56.25%;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 20px rgba(0,255,213,.3);
}
.video-box iframe{
position:absolute;
top:0;left:0;
width:100%;height:100%;
border:0;
}

/* GAME */
canvas{
display:block;
margin:20px auto;
border-radius:18px;
background:linear-gradient(#0a1a1f,#050b0f);
box-shadow:0 0 30px rgba(0,255,213,.35);
}

.abs-panel{
  text-align:center;
}

.abs-stage{
  position:relative;
  height:180px;
  margin:30px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:120px;
}

.abs-number{
  font-size:96px;
  font-weight:800;
  color:#ff0066;
  text-shadow:0 0 25px rgba(255,0,102,.7);
  transition:transform 1.2s ease, color .6s ease;
}

.abs-bars{
  font-size:120px;
  font-weight:800;
  color:#00ffd5;
  position:relative;
}

.abs-bars span{
  margin:0 14px;
}

.abs-glow{
  animation:absFlash .6s ease-out;
}

@keyframes absFlash{
  0%{text-shadow:0 0 0 #00ffd5}
  50%{text-shadow:0 0 50px #00ffd5}
  100%{text-shadow:0 0 0 #00ffd5}
}

#absBtn{
  font-family:Vazirmatn;
  font-size:1.1rem;
  padding:12px 28px;
  border:none;
  border-radius:30px;
  background:#00ffd5;
  color:#000;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,213,.6);
}
#absBtn:hover{transform:scale(1.05)}

.game-info{text-align:center;font-size:1.2rem;margin-top:10px}
footer{text-align:center;opacity:.6;padding:20px}
</style>
</head>

<body>

<header>
<h1>آزمایشگاه تعاملی قدر مطلق</h1>
<p>اعداد زنده‌اند؛ فاصله‌شان از صفر را لمس کن</p>
</header>

<!-- NUMBER AXIS -->
<div class="panel">
<h2>محور عددی تعاملی</h2>
<canvas id="numberAxis" width="900" height="120"></canvas>
<div class="game-info" id="axisInfo">|0| = 0</div>
</div>

<!-- VIDEO -->
<div class="panel">
<h2>🎥 معرفی پروژه</h2>
<div class="video-box">
<iframe src="Video/Amoozesh.mp4" allowfullscreen></iframe>
</div>
</div>

<!-- GAME -->
<div class="panel">
<h2>🎮 بازی شهر اعداد مثبت و منفی</h2>
<canvas id="lifeGame" width="720" height="420"></canvas>
<div class="game-info" id="lifeInfo">دو عدد را به هم بچسبان</div>
</div>

<!-- GAME 2 -->
<div class="panel abs-panel">
  <h2>🔮 تبدیل عدد منفی به قدر مطلق</h2>

  <div class="abs-stage">
    <div id="absNumber" class="abs-number">-5</div>

    <div class="abs-bars">
      <span>|</span>
      <span>|</span>
    </div>
  </div>

  <button id="absBtn">➡️ حرکت به سمت قدر مطلق</button>
</div>


<footer>طراحی و ساخته شده توسط خانوم ستایش شکری و خانوم تینا مالمیر</footer>

<script>
/* ========= MATH RAIN ========= */
const symbols=["+","−","×","÷","|x|","√","π","∞","-4","-1","0","2","6"];
const colors=["#00ffd5","#ff0066","#00ff99","#ffd700","#8a2be2"];
setInterval(()=>{
const s=document.createElement("div");
s.className="math-rain";
s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
s.style.left=Math.random()*100+"vw";
s.style.fontSize=16+Math.random()*26+"px";
s.style.color=colors[Math.floor(Math.random()*colors.length)];
s.style.animationDuration=3+Math.random()*5+"s";
document.body.appendChild(s);
setTimeout(()=>s.remove(),9000);
},180);

/* ========= NUMBER AXIS ========= */
const axis=document.getElementById("numberAxis");
const actx=axis.getContext("2d");
const axisInfo=document.getElementById("axisInfo");
let min=-10,max=10,value=0;

function map(v){return 50+(v-min)*(axis.width-100)/(max-min);}
function drawAxis(){
actx.clearRect(0,0,axis.width,axis.height);
actx.strokeStyle="#fff";actx.lineWidth=3;
actx.beginPath();actx.moveTo(50,60);actx.lineTo(axis.width-50,60);actx.stroke();
let zx=map(0);
actx.strokeStyle="#00ffd5";
actx.beginPath();actx.moveTo(zx,30);actx.lineTo(zx,90);actx.stroke();
for(let i=min;i<=max;i++){
let x=map(i);
actx.strokeStyle="#aaa";
actx.beginPath();actx.moveTo(x,55);actx.lineTo(x,65);actx.stroke();
actx.fillStyle="#aaa";actx.font="13px Vazirmatn";
actx.textAlign="center";actx.fillText(i,x,85);
}
let px=map(value);
actx.fillStyle="#ff0066";
actx.beginPath();actx.arc(px,60,10,0,Math.PI*2);actx.fill();
axisInfo.innerHTML=`|${value}| = ${Math.abs(value)}`;
}
axis.addEventListener("mousemove",e=>{
const r=axis.getBoundingClientRect();
value=Math.round(min+(e.clientX-r.left-50)*(max-min)/(axis.width-100));
value=Math.max(min,Math.min(max,value));
drawAxis();
});
drawAxis();

/* ========= LIVE NUMBER GAME ========= */
const game=document.getElementById("lifeGame");
const ctx=game.getContext("2d");
const info=document.getElementById("lifeInfo");

let freeze=false;
let nums=[];
let selected=null;

class LiveNumber{
constructor(x,y,val){
this.x=x;this.y=y;this.val=val;
this.vx=(Math.random()-.5)*1.5;
this.vy=(Math.random()-.5)*1.5;
this.drag=false;
}
draw(){
ctx.fillStyle=this.val<0?"#ff0066":"#00ff99";
ctx.font="bold 28px Vazirmatn";
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillText(this.val,this.x,this.y);
}
move(){
if(!this.drag && !freeze){
this.x+=this.vx;this.y+=this.vy;
}
if(this.x<30||this.x>game.width-30)this.vx*=-1;
if(this.y<30||this.y>game.height-30)this.vy*=-1;
}
}

function spawnNumber(){
return new LiveNumber(
Math.random()*600+60,
Math.random()*300+60,
Math.floor(Math.random()*21)-10
);
}

for(let i=0;i<6;i++) nums.push(spawnNumber());

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function loop(){
ctx.clearRect(0,0,game.width,game.height);
nums.forEach(n=>{n.move();n.draw();});

if(!freeze && selected){
for(let n of nums){
if(n!==selected && dist(n,selected)<35){
freeze=true;
let res=selected.val+n.val;
info.innerHTML=`${selected.val} + ${n.val} = ${res} |${res}|=${Math.abs(res)}`;

let cx=(selected.x+n.x)/2;
let cy=(selected.y+n.y)/2;

nums=nums.filter(x=>x!==n && x!==selected);
nums.push(new LiveNumber(cx,cy,res));

while(nums.length<6){
nums.push(spawnNumber());
}

selected=null;

setTimeout(()=>{
freeze=false;
info.innerHTML="ادامه بده!";
},700);
break;
}
}
}
requestAnimationFrame(loop);
}
loop();

/* DRAG + TOUCH */
function pos(e){
const r=game.getBoundingClientRect();
const p=e.touches?e.touches[0]:e;
return{x:p.clientX-r.left,y:p.clientY-r.top};
}
game.addEventListener("mousedown",e=>{
let p=pos(e);
nums.forEach(n=>{if(dist(n,p)<30){selected=n;n.drag=true;}});
});
game.addEventListener("mousemove",e=>{
if(selected){let p=pos(e);selected.x=p.x;selected.y=p.y;}
});
game.addEventListener("mouseup",()=>{if(selected)selected.drag=false;});

game.addEventListener("touchstart",e=>{
let p=pos(e);
nums.forEach(n=>{if(dist(n,p)<30){selected=n;n.drag=true;}});
});
game.addEventListener("touchmove",e=>{
e.preventDefault();
if(selected){let p=pos(e);selected.x=p.x;selected.y=p.y;}
},{passive:false});
game.addEventListener("touchend",()=>{if(selected)selected.drag=false;});

const absNumEl=document.getElementById("absNumber");
const absBtn=document.getElementById("absBtn");
const bars=document.querySelector(".abs-bars");

let currentValue;

function spawnNegative(){
  currentValue=-(Math.floor(Math.random()*9)+1);
  absNumEl.textContent=currentValue;
  absNumEl.style.transform="translateX(0)";
  absNumEl.style.color="#ff0066";
}

spawnNegative();

absBtn.addEventListener("click",()=>{
  absNumEl.style.transform="translateX(220px) scale(1.1)";

  setTimeout(()=>{
    bars.classList.add("abs-glow");
  },600);

  setTimeout(()=>{
    currentValue=Math.abs(currentValue);
    absNumEl.textContent=currentValue;
    absNumEl.style.color="#00ff99";
    absNumEl.style.transform="translateX(220px) scale(1.3)";
  },800);

  setTimeout(()=>{
    bars.classList.remove("abs-glow");
    spawnNegative();
  },2000);
});
</script>

</body>
</html>
